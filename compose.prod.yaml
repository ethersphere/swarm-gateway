name: swarm-gateway

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: swarmgateway
      MARIADB_USER: gateway
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build: .
    restart: unless-stopped
    environment:
      HOSTNAME: ${GATEWAY_HOSTNAME:?set GATEWAY_HOSTNAME in .env}
      PORT: "3000"
      TRUST_PROXY: "1"
      # Resolved over the shared `swarm` network, from the bee-services project.
      BEE_API_URL: http://bee:1633
      DATABASE_CONFIG: '{"host":"db","port":3306,"user":"gateway","database":"swarmgateway"}'
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - edge
      - swarm
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db-data:

networks:
  default:
  edge:
    external: true
  swarm:
    external: true
