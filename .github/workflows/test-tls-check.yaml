name: Test TLS Check

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - '**'

jobs:
    test-tls-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Run bee-dev
              run: npx bee-dev &

            - name: Wait for bee-dev
              run: npx npxie await http://localhost:1633/stamps

            - name: Run gateway
              run: |
                  export HOSTNAME=bzz.limo
                  node dist > gateway.log 2>&1 < /dev/null &

            - name: Wait for gateway
              run: npx npxie await http://localhost:3000/health

            - name: Expect 200 for exact hostname
              run: npx npxie code-equals "http://localhost:3000/tls-check?domain=bzz.limo" 200

            - name: Expect 200 for reference subdomain
              run: npx npxie code-equals "http://localhost:3000/tls-check?domain=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bzz.limo" 200

            - name: Expect 200 for CID subdomain
              run: npx npxie code-equals "http://localhost:3000/tls-check?domain=bah5acgzazjrvpieogf6rl3cwb7xtjzgykw6eyvkd2rhybrb4i3amjmsbllxa.bzz.limo" 200

            - name: Expect 403 for unresolvable ENS subdomain
              run: npx npxie code-equals "http://localhost:3000/tls-check?domain=www.mail.example.bzz.limo" 403

            - name: Expect 403 for look-alike domain
              run: npx npxie code-equals "http://localhost:3000/tls-check?domain=bzz.limo.evil.com" 403

            - name: Expect 403 for unrelated domain
              run: npx npxie code-equals "http://localhost:3000/tls-check?domain=evil.com" 403
